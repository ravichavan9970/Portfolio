    <!-- Inline Theme Synchronization Script -->
    <script>
      (function() {
        const savedMode = localStorage.getItem('portfolio-theme');
        let isDark = true;
        if (savedMode === 'light') {
          isDark = false;
        } else if (savedMode === 'dark') {
          isDark = true;
        }
        if (isDark) {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
      })();
    </script>
